{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Upload Allocation</h1><div class="muted">Import the official allocation workbook.</div></div></div><div class="card"><form method="post" enctype="multipart/form-data" class="formgrid"><div><label>Allocation month</label><input type="month" name="month" value="{{ month }}" required></div><div><label>Government Excel file</label><input type="file" name="file" accept=".xlsx,.xlsm" required></div><div><button>Import Allocation</button></div></form><p class="note">The workbook must contain a header row with “FPS Code” and commodity columns matching the Items list. Verify imported values against the signed government order.</p></div>{% endblock %}
